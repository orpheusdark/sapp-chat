services:
  - type: web
    name: orphchat-api
    runtime: node
    region: singapore
    plan: free
    buildCommand: npm ci --workspace backend --include-workspace-root=false
    startCommand: npm start --workspace backend
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: '22'
      - key: TRUST_PROXY
        value: '1'
      - key: JWT_SECRET
        generateValue: true
      - key: MONGODB_URI
        sync: false
      - key: CLIENT_ORIGINS
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
